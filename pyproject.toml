[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "densekit"
dynamic = ["version"]
description = "An offline-first dense retrieval and embedding toolkit for RAG"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tang Simu" }]
dependencies = ["numpy>=1.23"]

[tool.hatch.version]
path = "densekit/__about__.py"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["densekit", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = ["N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
