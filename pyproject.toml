[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "densekit"
dynamic = ["version"]
description = "An offline-first dense retrieval and embedding toolkit for RAG"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tang Simu" }]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
torch = ["torch>=1.13"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff==0.16.8",
  "mypy==1.14.1",
]

[project.urls]
Homepage = "https://github.com/ivyw960/densekit"
Issues = "https://github.com/ivyw960/densekit/issues"

[project.scripts]
densekit = "densekit.cli:main"

[tool.hatch.version]
path = "densekit/__about__.py"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["densekit", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = ["N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["densekit"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["densekit"]
omit = ["densekit/torch_backend/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
